<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MyCOCOS® | Registro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo"><img src="images/logo.png" alt="Logo"></a>
  </nav>

  <main class="register-container">
    <h1>REGISTRO</h1>
    <p style="margin-bottom: 25px; font-size: 0.9rem;">Por favor, rellene los siguientes campos:</p>

    <button class="social-btn">INICIAR SESIÓN CON GOOGLE</button>
    <button class="social-btn">INICIAR SESIÓN CON FACEBOOK</button>

    <form style="margin-top: 20px;">
      <input type="text" placeholder="Usuario/Correo..." class="form-input" required>
      <input type="password" placeholder="Contraseña" class="form-input" required>
      <button type="submit" class="btn-yellow" style="width: 100%; margin-top: 10px;">INICIAR SESIÓN</button>
    </form>

    <p style="margin-top: 20px; font-size: 0.8rem;">
      ¿Olvidaste tu contraseña? <a href="#" style="text-decoration: underline;">Clickea aquí</a>
    </p>
  </main>

  <script src="../js/script.js"></script>
</body>
</html>
