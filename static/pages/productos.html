<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MyCOCOS® | Packs y Kits</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <a href="carrito.html" class="nav-icon">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="cart-badge" id="cart-count">0</span>
      </a>
    </div>
    <a href="" class="logo"><img src="images/logo.png" alt="Logo"></a>
    <a href="registro.html" class="btn-login">Iniciar Sesión</a>
  </nav>

  <div class="top-bar" style="background-color: var(--yellow); color:#000; padding: 25px; text-align: left;">
    <h1 style="font-size: 2rem; font-weight: 900;">NUESTRAS MEJORES HERRAMIENTAS</h1>
    <p>APROVECHA LAS OFERTAS</p>
  </div>

  <section class="products-grid">
    <!-- Producto 1 -->
    <div class="product-card">
      <img src="images/prod-1.jpg" alt="The Essential Kit">
      <div class="product-info">
        <h3>THE ESSENTIAL KIT - LA RUTINA DEFINITIVA</h3>
        <div class="stars">★★★★★ (151 reseñas)</div>
        <div class="product-price">$59.990</div>
      </div>
      <button class="btn-yellow add-to-cart-btn" data-name="The Essential Kit" data-price="59990">+ AÑADIR AL CARRITO</button>
    </div>

    <!-- Producto 2 -->
    <div class="product-card">
      <img src="images/prod-2.jpg" alt="Pack Trio de Jabones">
      <div class="product-info">
        <h3>PACK TRIO DE JABONES PARA CUERPO Y CABELLO</h3>
        <div class="stars">★★★★★ (45 reseñas)</div>
        <div class="product-price">$17.990</div>
      </div>
      <button class="btn-yellow add-to-cart-btn" data-name="Pack Trio Jabones" data-price="17990">+ AÑADIR AL CARRITO</button>
    </div>
  </section>

  <script src="../js/script.js"></script>
</body>
</html>
